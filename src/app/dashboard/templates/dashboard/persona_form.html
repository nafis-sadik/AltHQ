<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Persona — Agent Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { background: #10141c; }
    .card { border: 1px solid #232b3b; }
    .card-header { background: #171d29; }
  </style>
</head>
<body class="text-light">
  <main class="container py-5" style="max-width: 720px;">
    <h1 class="h4 mb-4">Create the agent's persona</h1>
    {% if errors %}
      <div class="alert alert-danger">
        {% for error in errors %}<div>{{ error }}</div>{% endfor %}
      </div>
    {% endif %}
    <div id="error-box" class="alert alert-danger d-none" role="alert"></div>
    <form method="post" action="{% url 'dashboard:persona_api' %}" class="card" id="persona-create-form">
      {% csrf_token %}
      <div class="card-body row g-3">
        <div class="col-md-6">
          <label class="form-label" for="name">Name *</label>
          <input class="form-control" id="name" name="name" required
                 value="{{ form.name|default:'' }}">
        </div>
        <div class="col-md-6">
          <label class="form-label" for="gender">Gender</label>
          <select class="form-select" id="gender" name="gender">
            {% for option in gender_options %}
              <option value="{{ option.value }}" {% if form.gender == option.value %}selected{% endif %}>{{ option.label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12">
          <label class="form-label" for="profile_picture">Profile picture (path or URL)</label>
          <input class="form-control" id="profile_picture" name="profile_picture"
                 value="{{ form.profile_picture|default:'' }}" readonly="true">
        </div>
        <div class="col-12">
          <label class="form-label" for="bio">Bio *</label>
          <textarea class="form-control" id="bio" name="bio" rows="3" required>{{ form.bio|default:'' }}</textarea>
        </div>
        <div class="col-12">
          <label class="form-label" for="background_story">Background story</label>
          <textarea class="form-control" id="background_story" name="background_story" rows="4">{{ form.background_story|default:'' }}</textarea>
        </div>
        <div class="col-12 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Create persona</button>
          <a class="btn btn-outline-secondary" href="{% url 'dashboard:index' %}">Back</a>
        </div>
      </div>
    </form>
  </main>
  <script>
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
          const cookie = cookies[i].trim();
          if (cookie.substring(0, name.length + 1) === (name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    $('#persona-create-form').on('submit', function (event) {
      event.preventDefault();
      const box = $('#error-box');
      box.addClass('d-none');
      $.ajax({
        url: $(this).attr('action'),
        method: 'POST',
        data: $(this).serialize(),
        headers: { 'X-CSRFToken': getCookie('csrftoken') },
      }).done(function (data) {
        window.location.href = data.redirect;
      }).fail(function (xhr) {
        const errors = xhr.responseJSON && xhr.responseJSON.errors;
        box.removeClass('d-none').empty();
        (errors || ['The request could not be completed.']).forEach(function (message) {
          $('<div>').text(message).appendTo(box);
        });
      });
    });
  </script>
</body>
</html>
